name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        required: true
        options: [dev, qa, prod]
  # No `push` trigger, and a manual run against dev is refused too (first step
  # below). "dev" serves a real client, and a Bicep deploy replaces every app
  # setting. The template and main.dev.parameters.json now record the settings
  # dev runs with (gate G1), but lifting the refusal is a person's decision,
  # after reviewing a what-if and a clean `tools/check-app-settings.mjs --live`
  # against rg-bcr-ledger-dev. Until then dev is deployed as code-only zips:
  # docs/operations/human-steps.md.

permissions:
  id-token: write   # OIDC federation to Azure
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 30
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Refuse dev until the G1 review
        if: env.ENV_NAME == 'dev'
        run: |
          echo "::error::dev is production (it serves a real client). Bicep deploys to it are blocked until a person has reviewed the G1 drift fix (what-if and check-app-settings --live): deploy code-only zips as in docs/operations/human-steps.md."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build & test
        run: |
          yarn build
          yarn test

      # Package before touching Azure, so a failed package stops the run with
      # no infrastructure changed. The package script deletes the zip, dist and
      # tsbuildinfo, rebuilds, and tools/package-function.mjs refuses orphan
      # dist files, installs the yarn.lock versions with install scripts off
      # and verifies them in the archive; any failure exits non-zero.
      - name: Package teams-bot
        shell: bash
        run: yarn workspace @bcr/teams-bot package

      - name: Package document-ingestion
        shell: bash
        run: yarn workspace @bcr/document-ingestion package

      - name: Verify the packages
        shell: bash
        run: |
          for pkg in teams-bot document-ingestion; do
            if [[ ! -s "artifacts/$pkg.zip" ]]; then
              echo "::error::artifacts/$pkg.zip was not built"; exit 1
            fi
          done
          # Whole outputs are captured first: `unzip | grep -q` under pipefail
          # can fail (or pass) on unzip's SIGPIPE rather than on the match.
          check() { # zip, marker
            local config
            config="$(unzip -p "artifacts/$1.zip" node_modules/@bcr/shared/dist/config.js)"
            if [[ "$config" != *"$2"* ]]; then
              echo "::error::artifacts/$1.zip does not carry the Phase-0 @bcr/shared ($2)"; exit 1
            fi
          }
          check teams-bot botGateMode
          check document-ingestion forbiddenTargetSitePaths
          listing="$(unzip -Z1 artifacts/document-ingestion.zip)"
          if [[ "$listing" == *userTarget* ]]; then
            echo "::error::artifacts/document-ingestion.zip carries the deleted /api/user-target handler"; exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The template replaces every app setting, and what-if cannot show that.
      # If the apps already run, a setting set by hand and not recorded in the
      # parameters file would be deleted or reverted: stop here. Read-only.
      - name: App settings (template vs running apps)
        shell: bash
        run: |
          RG="rg-bcr-ledger-${ENV_NAME}"
          if [[ -n "$(az functionapp list -g "$RG" --query "[].name" -o tsv 2>/dev/null)" ]]; then
            node tools/check-app-settings.mjs --live -g "$RG" -p "infrastructure/main.${ENV_NAME}.parameters.json"
          else
            echo "No Function Apps in $RG yet: nothing to compare."
          fi

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-bcr-ledger-${{ env.ENV_NAME }}
          template: infrastructure/main.bicep
          parameters: infrastructure/main.${{ env.ENV_NAME }}.parameters.json
          deploymentName: bcr-ledger-${{ env.ENV_NAME }}-${{ github.run_id }}
          failOnStdErr: false

      - name: Deploy teams-bot function
        uses: azure/functions-action@v1
        with:
          app-name: func-bcr-bot-${{ env.ENV_NAME }}-${{ secrets.AZURE_NAME_SUFFIX }}
          package: artifacts/teams-bot.zip
          respect-funcignore: true

      - name: Deploy ingestion function
        uses: azure/functions-action@v1
        with:
          app-name: func-bcr-ingest-${{ env.ENV_NAME }}-${{ secrets.AZURE_NAME_SUFFIX }}
          package: artifacts/document-ingestion.zip
          respect-funcignore: true
