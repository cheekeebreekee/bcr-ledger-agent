name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        required: true
        options: [dev, qa, prod]
  # No `push` trigger, and a manual run against dev is refused too (first step
  # below). "dev" serves a real client, and main.bicep has drifted from the app
  # settings that are actually running (CLIENT_DIRECTORY_*, QUARANTINE_*,
  # BOT_CALLER_APP_IDS, FORBIDDEN_TARGET_SITE_PATHS, BOT_GATE_MODE are set by
  # hand and absent from the template). A Bicep deploy replaces every setting,
  # so ingestion would fail at cold start. Until the drift fix (gate G1), dev
  # is deployed as code-only zips: docs/operations/human-steps.md.

permissions:
  id-token: write   # OIDC federation to Azure
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 30
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Refuse dev until the Bicep drift fix (G1)
        if: env.ENV_NAME == 'dev'
        run: |
          echo "::error::dev is production (it serves a real client). Bicep deploys to it are blocked until the drift fix (G1): deploy code-only zips as in docs/operations/human-steps.md."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build & test
        run: |
          yarn build
          yarn test

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-bcr-ledger-${{ env.ENV_NAME }}
          template: infrastructure/main.bicep
          parameters: infrastructure/main.${{ env.ENV_NAME }}.parameters.json
          deploymentName: bcr-ledger-${{ env.ENV_NAME }}-${{ github.run_id }}
          failOnStdErr: false

      - name: Package teams-bot
        run: yarn workspace @bcr/teams-bot package

      - name: Package document-ingestion
        run: yarn workspace @bcr/document-ingestion package

      - name: Deploy teams-bot function
        uses: azure/functions-action@v1
        with:
          app-name: func-bcr-bot-${{ env.ENV_NAME }}-${{ secrets.AZURE_NAME_SUFFIX }}
          package: artifacts/teams-bot.zip
          respect-funcignore: true

      - name: Deploy ingestion function
        uses: azure/functions-action@v1
        with:
          app-name: func-bcr-ingest-${{ env.ENV_NAME }}-${{ secrets.AZURE_NAME_SUFFIX }}
          package: artifacts/document-ingestion.zip
          respect-funcignore: true
