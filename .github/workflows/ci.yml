name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Build all workspaces
        id: build
        run: yarn build

      # Coverage thresholds are per package (coverageThreshold in each
      # packages/*/jest.config.js) and a package below its threshold fails this
      # step, so a PR cannot quietly lower coverage. `test:coverage` runs the
      # same Jest suites as `yarn test`, so there is no separate plain-test step.
      - name: Test with coverage
        run: yarn test:coverage

      # node:test suites for the operator scripts (tools/**/*.test.mjs). Passes
      # when there are none. Runs even if the coverage step failed, so one CI run
      # reports both, but only once the build is green.
      - name: Test tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: yarn test:tools

  # The document index's isolation boundary, against a real PostgreSQL 16:
  # migrations as a superuser, then the RLS matrix, verify.sql, the pooled
  # connection a transaction leaves behind and the repositories, as a
  # NON-superuser login granted ledger_app (packages/ledger-db/itest). No
  # Azure: the service container is thrown away with the job.
  db-integration:
    name: DB integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LEDGER_TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: RLS matrix, verify.sql and repositories
        run: yarn test:db

  # The deploy packages, built exactly as a deploy builds them, so a broken
  # package (orphan dist file, lockfile drift, a dependency the code requires
  # but does not declare) fails the PR instead of the deploy. Nothing is
  # uploaded: artifacts/*.zip is git-ignored build output.
  package:
    name: Package Function Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Package teams-bot
        shell: bash
        run: yarn workspace @bcr/teams-bot package

      - name: Package document-ingestion
        shell: bash
        run: yarn workspace @bcr/document-ingestion package

  bicep-validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/

      - name: bicep build
        run: bicep build infrastructure/main.bicep --outdir /tmp/bicep-out

      - name: bicep lint
        run: bicep lint infrastructure/main.bicep

      # The document index database: a standalone template, never part of
      # main.bicep, deployed on its own by infrastructure/db-deploy.sh.
      - name: bicep build and lint (db.bicep)
        run: |
          bicep build infrastructure/db.bicep --outdir /tmp/bicep-out
          bicep lint infrastructure/db.bicep

      # A Bicep deploy replaces every app setting, so a setting the code needs
      # and the template lacks is an outage at the next deploy, and one the
      # template still sets after the code stopped reading it lingers for
      # ever. Offline: the config envMaps and schema vs the Bicep settings.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App settings (code vs Bicep)
        run: node tools/check-app-settings.mjs
