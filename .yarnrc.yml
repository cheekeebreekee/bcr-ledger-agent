# Use the classic node_modules layout so the standard TypeScript compiler
# and VS Code language service can resolve dependencies without the
# @yarnpkg/sdks PnP plugin. Trades a few hundred MB of disk for friction-free
# tooling.
nodeLinker: node-modules

# Don't enforce immutable installs in dev; CI passes --immutable explicitly.
enableImmutableInstalls: false

# Pretty output in CI logs
enableProgressBars: false
